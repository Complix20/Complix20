<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Alejandro Cabero, SIEM and Security Engineer, CTO at Monedita" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0C0B09"/>
      <stop offset="0.55" stop-color="#2A1D0A"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EDE6D6" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A524" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5A524" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="240" rx="14"/></clipPath>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; }
    .name { font-size: 58px; font-weight: 700; fill: #EDE6D6; letter-spacing: 1px; }
    .tag  { font-size: 21px; font-weight: 600; fill: #F5A524; }
    .hint { font-size: 15px; fill: #EDE6D6; fill-opacity: .55; }
    .cursor { animation: blink 1s steps(1) infinite; fill: #F5A524; }
    .sweep  { animation: sweep 6s linear infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1300px); } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <rect width="1200" height="240" fill="url(#grid)"/>
    <rect class="sweep" x="0" y="0" width="300" height="240" fill="url(#scan)" opacity="0.35"/>
    <text class="mono hint" x="40" y="46">$ whoami</text>
    <text class="mono name" x="600" y="125" text-anchor="middle">Alejandro Cabero</text>
    <text class="mono tag" x="600" y="170" text-anchor="middle">SIEM &amp; Security Engineer  ·  CTO @ Monedita</text>
    <rect class="cursor" x="1118" y="196" width="14" height="4"/>
  </g>
</svg>
